name: WristGPT
options:
  bundleIdPrefix: personal.wristgpt
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WristGPT:
    type: application
    platform: iOS
    sources:
      - Phone
      - Shared
    dependencies:
      - target: WristGPTWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.wristgpt.phone
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: WristGPT
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: 'WristGPT подключается к вашему компьютеру для запросов через вашу подписку ChatGPT.'
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    scheme:
      testTargets: []
  WristGPTWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.wristgpt.phone.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SDKROOT: watchos
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: WristGPT
        WKApplication: true
        WKCompanionAppBundleIdentifier: personal.wristgpt.phone
        WKRunsIndependentlyOfCompanionApp: true
        NSLocalNetworkUsageDescription: 'WristGPT подключается к вашему компьютеру в домашней сети.'
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    scheme:
      testTargets: []
