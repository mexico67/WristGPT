name: Build experimental Watch installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned community sources and apply transport patch
        shell: pwsh
        run: |
          git -c core.autocrlf=false clone https://github.com/Rzbck/iloader.git "$env:RUNNER_TEMP/iloader"
          git -C "$env:RUNNER_TEMP/iloader" checkout f2efcc3c9784e7446abf8573ee3514e779ea083c
          git -c core.autocrlf=false clone https://github.com/Rzbck/isideload.git "$env:RUNNER_TEMP/isideload"
          git -C "$env:RUNNER_TEMP/isideload" checkout 13db9b28ff72f42fc6432fbeac592004bede57c7
          git -C "$env:RUNNER_TEMP/isideload" apply "$env:GITHUB_WORKSPACE/installer-patches/grandslam-http1.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }
          $manifest = "$env:RUNNER_TEMP/iloader/src-tauri/Cargo.toml"
          $content = Get-Content -Raw $manifest
          $old = 'isideload = { version = "0.3.17", features = ["fs-storage"], git = "https://github.com/Rzbck/isideload", package = "isideload", rev = "13db9b28ff72f42fc6432fbeac592004bede57c7" }'
          $new = 'isideload = { version = "0.3.17", features = ["fs-storage"], path = "../../isideload/isideload", package = "isideload" }'
          if (!$content.Contains($old)) { throw 'Unexpected dependency declaration' }
          [IO.File]::WriteAllText($manifest, $content.Replace($old, $new))
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Windows build dependencies
        shell: pwsh
        run: choco install strawberryperl make --no-progress -y
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        working-directory: ${{ runner.temp }}/iloader
        run: bun i --frozen-lockfile
      - name: Build Windows installer
        working-directory: ${{ runner.temp }}/iloader
        run: bun run tauri build --config src-tauri/ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: WristGPT-watch-installer-experimental
          path: ${{ runner.temp }}/iloader/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
